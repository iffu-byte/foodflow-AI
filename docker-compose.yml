name: foodflow-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodflow
      POSTGRES_PASSWORD: foodflow
      POSTGRES_DB: foodflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodflow -d foodflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      ENV: ${ENV:-demo}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to a long random value before starting FoodFlow}
      DATABASE_URL: postgresql+asyncpg://foodflow:foodflow@db:5432/foodflow
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-haversine}
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./ml:/ml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      - api

  simulator:
    build: ./simulator
    profiles: ["simulator"]
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://foodflow:foodflow@db:5432/foodflow
    volumes:
      - ./simulator:/app/simulator
    depends_on:
      api:
        condition: service_healthy

  osrm:
    image: osrm/osrm-backend
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld /data/region.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"

volumes:
  pgdata:
